tags:
  - Gene Expression 
summary: "Gene expression"
description: "Gets gene expression in healthy tissue."
operationId: "Gene expression in healthy tissues"
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          gene_ids:
            type: array
            description: "List of gene identifiers."
            items:
              type: string
            example: ["BRCA1", "BRCA2"]
          tissue:
            type: string
            enum:
              - Adipose Tissue
              - Adrenal Gland
              - Bladder
              - Blood
              - Blood Vessel
              - Brain
              - Breast
              - Cervix Uteri
              - Colon
              - Esophagus
              - Fallopian Tube
              - Heart
              - Kidney
              - Liver
              - Lung
              - Muscle
              - Nerve
              - Ovary
              - Pancreas
              - Pituitary
              - Prostate
              - Salivary Gland
              - Skin
              - Small Intestine
              - Spleen
              - Stomach
              - Testis
              - Thyroid
              - Uterus
              - Vagina
            example: "Skin" 
          type:
            type: string
            enum:
              - json
              - gzip
            example: "gzip"
          samples:
            type: boolean
            description: "Include sample ids in the response. Defaults to false."
            example: true
responses:
  200:
    description: "Expression values of each gene according to the GTEx database. The samples key is optional and only returned when requested."
    content:
      application/json:
        schema:
          type: object
          properties:
            samples:
              type: array
              items:
                type: string
              example: ["GTEX-WWYW-0008-SM-4MVPF", "GTEX-WXYG-0008-SM-4ONDU", "GTEX-WXYG-2026-SM-4E3IY"]
            BRCA1:
              type: array
              items:
                type: number
              example: [12.33, 0, 4.18]
            BRCA2:
              type: array
              items:
                type: number
              example: [2.38, 1.12, 8.26]